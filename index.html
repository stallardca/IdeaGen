<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Idea Evolution Tree</title>
  <script src="https://d3js.org/d3.v6.min.js"></script>
  <style>
    :root {
      color-scheme: light;
    }
    body {
      font-family: "Inter", "Segoe UI", sans-serif;
      margin: 0;
      padding: 24px;
      background: #f5f7fb;
      color: #1f2a44;
    }
    header {
      max-width: 980px;
      margin: 0 auto 20px;
      text-align: center;
    }
    h1 {
      margin-bottom: 8px;
      font-size: 28px;
    }
    p {
      margin: 0;
      color: #4b5a78;
    }
    #controls {
      max-width: 980px;
      margin: 20px auto;
      background: #ffffff;
      padding: 16px 20px;
      border-radius: 12px;
      box-shadow: 0 12px 24px rgba(31, 42, 68, 0.08);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      align-items: center;
    }
    label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #7382a4;
      display: block;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #d6dce8;
      font-size: 14px;
    }
    button {
      padding: 11px 16px;
      border: none;
      border-radius: 8px;
      background: #2d6cdf;
      color: white;
      font-size: 14px;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      width: 100%;
    }
    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 12px rgba(45, 108, 223, 0.24);
    }
    #hint {
      max-width: 980px;
      margin: 0 auto 10px;
      text-align: center;
      font-size: 13px;
      color: #5b6a89;
    }
    svg {
      width: 100%;
      height: 640px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 12px 24px rgba(31, 42, 68, 0.08);
    }
    .node circle {
      fill: #ffffff;
      stroke: #2d6cdf;
      stroke-width: 2px;
    }
    .node.active circle {
      fill: #2d6cdf;
    }
    .node text {
      font-size: 12px;
      pointer-events: none;
      fill: #1f2a44;
    }
    .node.active text {
      fill: #ffffff;
    }
    .link {
      fill: none;
      stroke: #d0d7e6;
      stroke-width: 2px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Idea Evolution Tree</h1>
    <p>Generate seed ideas, click one you love, and watch it evolve into new business concepts.</p>
  </header>
  <div id="controls">
    <div>
      <label for="apikey">OpenAI API Key</label>
      <input type="password" id="apikey" placeholder="sk-...">
    </div>
    <div>
      <label for="interests">Your interests</label>
      <input type="text" id="interests" placeholder="e.g. wellness, fintech, pets">
    </div>
    <div>
      <label>&nbsp;</label>
      <button id="generate">Generate Seed Ideas</button>
    </div>
  </div>
  <div id="hint">Tip: click an idea node to generate its next evolution.</div>
  <svg></svg>

  <script>
    let nodeIdCounter = 0;
    let activeNodeId = null;

    let rootData = {
      name: "Business Ideas",
      children: []
    };

    const svg = d3.select("svg"),
          width = parseFloat(svg.style("width")),
          height = parseFloat(svg.style("height"));

    const g = svg.append("g").attr("transform", "translate(40,0)");
    const tree = d3.tree().size([height, width - 200]);

    let root = d3.hierarchy(rootData, d => d.children);

    async function fetchIdeas(promptSeed) {
      const OPENAI_API_KEY = document.getElementById("apikey").value.trim();
      if (!OPENAI_API_KEY) {
        alert("Please enter your OpenAI API key to generate ideas.");
        return [];
      }

      const prompt = `You are a business ideation assistant. Create three short, distinct business ideas based on: "${promptSeed}". Respond as JSON array of strings.`;

      try {
        const response = await fetch("https://api.openai.com/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${OPENAI_API_KEY}`
          },
          body: JSON.stringify({
            model: "gpt-4o-mini",
            response_format: { type: "json_object" },
            messages: [
              {
                role: "system",
                content: "Return a JSON object with an array field named ideas."
              },
              { role: "user", content: prompt }
            ],
            temperature: 0.8,
            max_tokens: 200
          })
        });

        const data = await response.json();
        const raw = data.choices?.[0]?.message?.content || "{}";
        const parsed = JSON.parse(raw);
        const ideas = parsed.ideas;
        if (!Array.isArray(ideas) || ideas.length === 0) {
          throw new Error("The AI response did not include an ideas array.");
        }
        return ideas.map(text => ({ name: text, children: [] }));
      } catch (error) {
        console.error("Error generating AI ideas:", error);
        alert("Sorry, we couldn't generate ideas right now. Please check your API key and try again.");
        return [];
      }
    }

    function update(source) {
      root = d3.hierarchy(rootData, d => d.children);
      const treeData = tree(root);

      const nodes = treeData.descendants();
      const links = treeData.descendants().slice(1);

      nodes.forEach(d => { d.y = d.depth * 200; });

      const node = g.selectAll("g.node")
                    .data(nodes, d => d.id || (d.id = ++nodeIdCounter));

      const nodeEnter = node.enter().append("g")
                          .attr("class", "node")
                          .attr("transform", d => `translate(${d.y},${d.x})`)
                          .on("click", async function(event, d) {
                            activeNodeId = d.id;
                            if (!d.data.children || d.data.children.length === 0) {
                              d.data.children = await fetchIdeas(d.data.name);
                            }
                            update(d);
                          });

      nodeEnter.append("circle").attr("r", 12);

      nodeEnter.append("text")
               .attr("dy", 4)
               .attr("x", d => d.children ? -16 : 16)
               .style("text-anchor", d => d.children ? "end" : "start")
               .text(d => d.data.name);

      const nodeUpdate = nodeEnter.merge(node);
      nodeUpdate
        .classed("active", d => d.id === activeNodeId)
        .transition()
        .duration(200)
        .attr("transform", d => `translate(${d.y},${d.x})`);

      node.exit().remove();

      const link = g.selectAll("path.link")
                    .data(links, d => d.id);

      const linkEnter = link.enter().insert("path", "g")
                          .attr("class", "link")
                          .attr("d", d => {
                            let o = { x: source.x, y: source.y };
                            return diagonal(o, o);
                          });

      linkEnter.merge(link)
               .transition()
               .duration(200)
               .attr("d", d => diagonal(d, d.parent));

      link.exit().remove();
    }

    function diagonal(s, d) {
      return `M ${s.y} ${s.x}
              C ${(s.y + d.y) / 2} ${s.x},
                ${(s.y + d.y) / 2} ${d.x},
                ${d.y} ${d.x}`;
    }

    update(rootData);

    document.getElementById("generate").addEventListener("click", async function() {
      const interests = document.getElementById("interests").value || "emerging consumer trends";
      rootData.children = await fetchIdeas(interests);
      activeNodeId = null;
      update(rootData);
    });
  </script>
</body>
</html>
